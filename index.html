<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO Do App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-neutral-50">
    <main class="min-h-screen flex items-center justify-center p-6">
      <div
        class="w-full max-w-md bg-white p-6 rounded-3xl shadow-xs border border-neutral-100"
      >
        <h1 class="text-3xl font-bold text-neutral-800 mb-6 tracking-tight">
          Your To Do
        </h1>

        <form id="todo-form" class="flex items-center gap-4 mb-8">
          <input
            type="text"
            id="todo-input"
            placeholder="Add new task"
            class="flex-1 py-2 border-b-2 border-neutral-200 focus:outline-none focus:border-neutral-800 text-neutral-700 placeholder-neutral-400 bg-transparent transition-colors"
          />
          <button
            type="submit"
            class="bg-neutral-800 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl hover:bg-neutral-700 transition-colors"
          >
            +
          </button>
        </form>

        <ul id="todo-list" class="space-y-3"></ul>

        <div class="mt-8 border-t border-neutral-100 pt-5 space-y-3">
          <div class="flex justify-between items-center">
            <p id="todo-counter" class="text-blue-900 font-semibold text-sm">
              Your remaining Todos : 0
            </p>

            <button
              id="delete-completed-btn"
              class="hidden text-xs bg-red-100 text-red-600 hover:bg-red-200 font-bold px-3 py-1.5 rounded-xl transition-all cursor-pointer"
            >
              Delete Selected
            </button>
          </div>

          <p class="text-neutral-900 text-xs leading-relaxed">
            "Doing what you love is the cornerstone of having abundance in your
            life." - Wayne Dyer
          </p>
        </div>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
